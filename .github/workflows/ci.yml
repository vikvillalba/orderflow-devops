name: CI

on:
  push:
    branches: [ main, avance-2-testing, avance-3-artefactos-docker ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build y pruebas (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 21 (Temurin) y cache de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Build y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Publicar los reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: warn

      - name: Configurar registro de Docker como Insecure Registry
        if: github.event_name != 'pull_request'
        run: |
          sudo mkdir -p /etc/docker
          echo '{"insecure-registries": ["18.233.67.102:8082"]}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart

      - name: Iniciar sesión en Nexus Docker
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login 18.233.67.102:8082 -u "${{ secrets.NEXUS_USER }}" --password-stdin

      - name: Construir imagen Docker con tag SHA
        if: github.event_name != 'pull_request'
        run: |
          docker build -t 18.233.67.102:8082/orderflow:${{ github.sha }} .

      - name: Publicar imagen en Nexus
        if: github.event_name != 'pull_request'
        run: |
          docker push 18.233.67.102:8082/orderflow:${{ github.sha }}
